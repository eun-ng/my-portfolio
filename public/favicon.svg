<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background mesh -->
    <radialGradient id="mesh1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Specular highlight for glass -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#020617" flood-opacity="0.1" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="#f8fafc" />
  <rect width="512" height="512" rx="112" fill="url(#mesh1)" />
  <rect width="512" height="512" rx="112" fill="url(#mesh2)" />
  <rect width="512" height="512" rx="112" fill="url(#mesh3)" />
  
  <!-- Inner Glass Plate -->
  <!-- More transparent, dynamic border -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="#ffffff" fill-opacity="0.25" stroke="url(#glass-border)" stroke-width="6" filter="url(#glass-shadow)"/>
  
  <!-- Diagonal glass glare (top-left) -->
  <path d="M64 200 Q 200 64 300 64 H 144 Q 64 64 64 144 Z" fill="#ffffff" fill-opacity="0.4"/>
  
  <!-- Letter E (Eun) Optically centered -->
  <path d="M336 160 L192 160 V352 L336 352 M192 256 L306 256" fill="none" stroke="url(#n-grad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>