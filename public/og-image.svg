<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <!-- Background mesh gradients (More vivid for Liquid Glass) -->
    <radialGradient id="mesh1" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Specular border -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="40" flood-color="#020617" flood-opacity="0.08" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="1200" height="630" fill="#f8fafc" />
  <rect width="1200" height="630" fill="url(#mesh1)" />
  <rect width="1200" height="630" fill="url(#mesh2)" />
  <rect width="1200" height="630" fill="url(#mesh3)" />
  
  <!-- Floating Glass Plate (More Transparent + Shiny Border) -->
  <rect x="250" y="165" width="700" height="300" rx="40" fill="#ffffff" fill-opacity="0.25" stroke="url(#glass-border)" stroke-width="4" filter="url(#glass-shadow)"/>
  
  <!-- Diagonal glass glare (top-left) -->
  <path d="M250 300 Q 400 165 500 165 H 330 Q 250 165 250 245 Z" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Content inside Glass Plate Perfectly Centered -->
  <g transform="translate(600, 310)">
    <text x="0" y="-10" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', sans-serif" font-weight="700" font-size="76" fill="url(#text-grad)" letter-spacing="-1">
      남궁은
    </text>
    <text x="1" y="65" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Helvetica Neue', sans-serif" font-weight="600" font-size="28" fill="#64748b" letter-spacing="2">
      DEVELOPER
    </text>
  </g>
</svg>